  stage.innerHTML = `<div class="card">
    <div class="tags">
      <span class="tag subj" style="background:${SUBJCOLOR[genObj.s]};color:#0b1020">${SUBJNAME[genObj.s]}</span>
      <span class="tag">${genObj.t}</span>
      <span class="tag">🔢 solve it</span>
    </div>
    <div class="q">${p.q}</div>
    <div class="prow">
      <input id="ans" class="ansinput" type="text" inputmode="decimal" placeholder="Type your answer, then Check…" autocomplete="off">
      <button class="btn primary" id="check">Check</button>
    </div>
    <div class="explain" id="explain"></div>
    <div class="actions">
      <button class="btn" id="showsol">💡 Show solution</button>
      <button class="btn primary" id="newp">New problem →</button>
    </div>
  </div>`;
  const input = document.getElementById("ans");
  const explain = document.getElementById("explain");
  function judge(reveal){
    if(state.answered) return;
    const raw = input.value.trim();
    if(!reveal && raw===""){ input.focus(); return; }
    state.answered = true; state.attempts++;
    const user = parseFloat(raw.replace(/,/g,""));
    const tol = Math.max(p.tol||0.01, Math.abs(p.ans)*0.005);
    const correct = !reveal && isFinite(user) && Math.abs(user - p.ans) <= tol;
    let verdict;
    if(reveal){ verdict = `<span style="color:var(--warn)">Solution</span>`; state.streak = 0; }
    else if(correct){ verdict = `<span style="color:var(--ok)">&#10004; Correct</span>`; state.score++; state.streak++; if(state.score>state.best){ state.best=state.score; const gg=store.get(); gg.best=state.best; store.set(gg); } }
    else { verdict = `<span style="color:var(--bad)">&#10008; Not quite</span>`; state.streak = 0; }
    explain.innerHTML = `<div class="verdict">${verdict} &nbsp;·&nbsp; Answer: <b>${r2(p.ans,4)}</b>${p.unit?(" "+p.unit):""}</div>${p.sol}`;
    explain.classList.add("show");
    input.disabled = true; document.getElementById("check").disabled = true;
    typeset(explain); updateStats();
  }
  document.getElementById("check").onclick = ()=> judge(false);
  document.getElementById("showsol").onclick = ()=> judge(true);
  document.getElementById("newp").onclick = ()=> renderPractice();
  input.addEventListener("keydown", ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); judge(false); } });
  input.focus();
  typeset(stage);
  updateStats();
}

/* ---- Mock exam mode ---- */
function examPool(){ return BANK.map((q,i)=>i).filter(i => state.subject==="ALL" || BANK[i].s===state.subject); }
function stopExamTimer(){ if(state.exam && state.exam.timerId){ clearInterval(state.exam.timerId); state.exam.timerId=null; } }
function fmtTime(ms){ const s=Math.floor(ms/1000), m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

function renderExam(){
  const ex = state.exam;
  if(!ex || ex.stage==="setup") return renderExamSetup();
  if(ex.stage==="results") return renderExamResults();
  return renderExamQuestion();
}

function renderExamSetup(){
  const stage = document.getElementById("stage");
  const avail = examPool().length;
  let counts = [10,15,20,30].filter(c=> c<=avail);
  if(!counts.length) counts=[avail];
  if(!state.exam || state.exam.stage!=="setup") state.exam = { stage:"setup", count: counts[Math.min(1,counts.length-1)] };
  if(!counts.includes(state.exam.count)) state.exam.count=counts[0];
  const chips = counts.map(c=>`<button class="ecount ${state.exam.count===c?'sel':''}" data-c="${c}">${c} Q</button>`).join("");
  const mins = Math.round(state.exam.count*1.5);
  const subjLabel = state.subject==="ALL"?"all subjects":SUBJNAME[state.subject];
  stage.innerHTML = `<div class="card">
    <div class="tags"><span class="tag subj" style="background:var(--brand);color:#0b1020">📄 Mock Exam</span><span class="tag">${state.subject==="ALL"?"All subjects":SUBJNAME[state.subject]}</span></div>
    <div class="q">Timed mock exam — answer everything, then get a full report with your <b>weakest topics</b> highlighted so you know exactly what to revise.</div>
    <p class="hint">Choose length (≈1.5 min/question). No feedback until you submit — just like the real exam.</p>
    <div class="row" id="ecounts" style="margin:14px 0">${chips}</div>
    <p class="hint">⏱️ Duration: <b>${mins} min</b> · ${avail} questions available for ${subjLabel}</p>
    <div class="actions"><span></span><button class="btn primary" id="estart">Start exam →</button></div>
  </div>`;
  document.getElementById("ecounts").onclick = (e)=>{ const b=e.target.closest(".ecount"); if(!b) return; state.exam.count=+b.dataset.c; renderExamSetup(); };
  document.getElementById("estart").onclick = ()=> startExam(state.exam.count);
  setExamBar(0, state.exam.count);
  typeset(stage);
}

function startExam(count){
  const qs = shuffle(examPool()).slice(0, count);
  state.exam = { stage:"running", qs, answers:new Array(qs.length).fill(null), idx:0, startMs:Date.now(), durationMs:count*90*1000, timerId:null };
  state.exam.timerId = setInterval(examTick, 1000);
  renderExamQuestion();
}

function examRemaining(){ const ex=state.exam; return Math.max(0, ex.durationMs-(Date.now()-ex.startMs)); }
function examTick(){
  const el=document.getElementById("examtimer"); const rem=examRemaining();
  if(el){ el.textContent="⏱️ "+fmtTime(rem); el.style.color = rem<60000?"var(--bad)":"var(--ink)"; }
  if(rem<=0) submitExam();
}

function renderExamQuestion(){
  const ex=state.exam, stage=document.getElementById("stage");
  const item=BANK[ex.qs[ex.idx]], chosen=ex.answers[ex.idx];
  const opts=item.o.map((o,k)=>`<button class="opt ${chosen===k?'selected':''}" data-k="${k}"><span class="k">${String.fromCharCode(65+k)}</span><span>${o}</span></button>`).join("");
  const pal=ex.qs.map((_,i)=>`<button class="pcell ${i===ex.idx?'cur':''} ${ex.answers[i]!==null?'done':''}" data-i="${i}">${i+1}</button>`).join("");
  const answeredN=ex.answers.filter(a=>a!==null).length;
  stage.innerHTML = `<div class="card">
    <div class="examhead">
      <div class="tags"><span class="tag subj" style="background:${SUBJCOLOR[item.s]};color:#0b1020">${SUBJNAME[item.s]}</span><span class="tag">Q${ex.idx+1} / ${ex.qs.length}</span></div>
      <div id="examtimer" class="examtimer">⏱️ ${fmtTime(examRemaining())}</div>
    </div>
    <div class="q">${item.q}</div>
    <div class="opts">${opts}</div>
    <div class="palette">${pal}</div>
    <div class="actions">
      <button class="btn" id="eprev" ${ex.idx===0?'disabled':''}>← Prev</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="esubmit">Submit (${answeredN}/${ex.qs.length}) ✔</button>
        <button class="btn primary" id="enext">${ex.idx===ex.qs.length-1?'Finish →':'Next →'}</button>
      </div>
    </div>
  </div>`;
  stage.querySelectorAll(".opt").forEach(b=> b.onclick=()=>{ ex.answers[ex.idx]=+b.dataset.k; renderExamQuestion(); });
  stage.querySelectorAll(".pcell").forEach(b=> b.onclick=()=>{ ex.idx=+b.dataset.i; renderExamQuestion(); });
  document.getElementById("eprev").onclick=()=>{ if(ex.idx>0){ ex.idx--; renderExamQuestion(); } };
  document.getElementById("enext").onclick=()=>{ if(ex.idx<ex.qs.length-1){ ex.idx++; renderExamQuestion(); } else confirmSubmit(); };
  document.getElementById("esubmit").onclick=()=> confirmSubmit();
  setExamBar(answeredN, ex.qs.length);
  typeset(stage);
}

function confirmSubmit(){
  const un=state.exam.answers.filter(a=>a===null).length;
  if(un>0 && !confirm(un+" question(s) still unanswered. Submit and see your report?")) return;
  submitExam();
}

function submitExam(){
  stopExamTimer();
  state.exam.stage="results";
  state.exam.usedMs=Math.min(state.exam.durationMs, Date.now()-state.exam.startMs);
  let ec=0; const et={};
  state.exam.qs.forEach((qi,i)=>{ const it=BANK[qi], ok=state.exam.answers[i]===it.a; if(ok) ec++; const key=SUBJNAME[it.s]+" · "+it.t; et[key]=et[key]||{c:0,t:0}; et[key].t++; if(ok) et[key].c++; });
  const tot=state.exam.qs.length;
  saveExamRecord({ ts:Date.now(), subject:state.subject, count:tot, correct:ec, total:tot, pct:Math.round(ec/tot*100), usedMs:state.exam.usedMs, topics:et });
  renderExamResults();
}

function renderExamResults(){
  const ex=state.exam, stage=document.getElementById("stage");
  let correct=0; const bySubj={}, byTopic={}, review=[];
  ex.qs.forEach((qi,i)=>{
    const item=BANK[qi], chosen=ex.answers[i], ok=chosen===item.a;
    if(ok) correct++;
    bySubj[item.s]=bySubj[item.s]||{c:0,t:0}; bySubj[item.s].t++; if(ok) bySubj[item.s].c++;
    const key=SUBJNAME[item.s]+" · "+item.t; byTopic[key]=byTopic[key]||{c:0,t:0}; byTopic[key].t++; if(ok) byTopic[key].c++;
    review.push({item, chosen, ok});
  });
  const total=ex.qs.length, pct=Math.round(correct/total*100);
  const msg = pct>=85?"Outstanding — exam-ready! 🏆":pct>=65?"Solid pass. Tighten the weak topics below. 💪":"Keep going — focus on the red topics below. 📖";
  const subjRows=Object.keys(bySubj).map(s=>{ const d=bySubj[s], p=Math.round(d.c/d.t*100); return `<tr><td>${SUBJNAME[s]}</td><td>${d.c}/${d.t}</td><td><span class="pill ${p>=70?'g':p>=40?'y':'r'}">${p}%</span></td></tr>`; }).join("");
  const weak=Object.keys(byTopic).map(k=>({k,c:byTopic[k].c,t:byTopic[k].t,p:byTopic[k].c/byTopic[k].t})).sort((a,b)=> a.p-b.p || b.t-a.t);
  const weakRows=weak.map(w=>`<tr><td>${w.k}</td><td>${w.c}/${w.t}</td><td><span class="pill ${w.p>=0.7?'g':w.p>=0.4?'y':'r'}">${Math.round(w.p*100)}%</span></td></tr>`).join("");
  const reviewHTML=review.map((r,i)=>`<div class="rev ${r.ok?'ok':'bad'}">
      <div class="revq"><b>Q${i+1}.</b> ${r.item.q} &nbsp;<span class="tag">${SUBJNAME[r.item.s]} · ${r.item.t}</span></div>
      <div class="hint">Your answer: <b>${r.chosen===null?'— (blank)':String.fromCharCode(65+r.chosen)+') '+r.item.o[r.chosen]}</b> ${r.ok?'&#10004;':'&#10008; · Correct: <b>'+String.fromCharCode(65+r.item.a)+') '+r.item.o[r.item.a]+'</b>'}</div>
      ${r.ok?'':'<div class="revexp">'+r.item.e+'</div>'}
    </div>`).join("");
  stage.innerHTML = `<div class="card done">
      <div class="score-big">${correct}/${total}</div>
      <h2>${pct}% &nbsp;·&nbsp; ⏱️ ${fmtTime(ex.usedMs)}</h2>
      <p class="hint">${msg}</p>
      <p class="hint">✔ Saved to your <a href="#" id="goprog">📈 Progress</a> — track improvement over time.</p>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin:0 0 10px">📊 By subject</h3>
      <table class="rtab"><tr><th>Subject</th><th>Score</th><th>%</th></tr>${subjRows}</table>
      <h3 style="margin:18px 0 10px">🎯 Topics — weakest first (revise these)</h3>
      <table class="rtab"><tr><th>Topic</th><th>Score</th><th>%</th></tr>${weakRows}</table>
      <div class="actions" style="margin-top:16px">
        <button class="btn" id="eretake">🔁 Retake</button>
        <button class="btn primary" id="edone">Back to study</button>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin:0 0 4px">📝 Full review</h3>
      <p class="hint" style="margin:0 0 12px">Every wrong answer includes its explanation.</p>
      ${reviewHTML}
    </div>`;
  document.getElementById("eretake").onclick=()=>{ state.exam={stage:"setup",count:total}; renderExamSetup(); };
  document.getElementById("edone").onclick=()=>{ state.exam=null; setMode("quiz"); };
  const gp=document.getElementById("goprog"); if(gp) gp.onclick=(e)=>{ e.preventDefault(); setMode("progress"); };
  setExamBar(total,total);
  window.scrollTo({top:0,behavior:"smooth"});
  typeset(stage);
}

function setExamBar(done,total){
  const pl=document.getElementById("poslabel"); if(pl) pl.textContent="Exam";
  document.getElementById("pos").textContent=done;
  document.getElementById("total").textContent=total;
  document.getElementById("score").textContent="—";
  document.getElementById("streak").textContent="—";
  document.getElementById("best").textContent=state.best;
  document.getElementById("pbar").style.width=(total?done/total*100:0)+"%";
}

/* ---- Exam history & progress ---- */
function loadHistory(){ return (store.get().history)||[]; }
function saveExamRecord(rec){
  const g = store.get();
  g.history = g.history || [];
  g.history.push(rec);
  if(g.history.length>200) g.history = g.history.slice(-200);
  store.set(g);
}

function setProgressBar(hist){
  const pl=document.getElementById("poslabel"); if(pl) pl.textContent="Exams";
  document.getElementById("pos").textContent=hist.length;
  document.getElementById("total").textContent=hist.length;
  document.getElementById("score").textContent = hist.length? Math.max.apply(null,hist.map(h=>h.pct))+"%" : "—";
  document.getElementById("streak").textContent="—";
  document.getElementById("best").textContent=state.best;
  document.getElementById("pbar").style.width=(hist.length?100:0)+"%";
}

function renderProgress(){
  const stage=document.getElementById("stage");
  const hist=loadHistory();
  setProgressBar(hist);
  if(!hist.length){
    stage.innerHTML=`<div class="card empty">📈 No exam history yet.<br><br>Take a <b>📄 Mock Exam</b> and your scores + weak topics get tracked here so you can watch yourself improve.<div class="actions" style="justify-content:center;margin-top:18px"><span></span><button class="btn primary" id="goexam">Start a mock exam →</button></div></div>`;
    document.getElementById("goexam").onclick=()=> setMode("exam");
    return;
  }
  const n=hist.length;
  const avg=Math.round(hist.reduce((s,h)=>s+h.pct,0)/n);
  const best=Math.max.apply(null,hist.map(h=>h.pct));
  const last=hist[n-1].pct;
  const trend = n>=2 ? (last-hist[n-2].pct) : 0;
  const trendTxt = n<2?"":(trend>0?`▲ +${trend}%`:trend<0?`▼ ${trend}%`:"▬ 0%");
  const recent=hist.slice(-24);
  const bars=recent.map(h=>{ const cls=h.pct>=70?'g':h.pct>=40?'y':'r'; const d=new Date(h.ts); return `<div class="sbar ${cls}" style="height:${Math.max(4,h.pct)}%" title="${d.toLocaleDateString()} · ${h.pct}% (${h.correct}/${h.total})"></div>`; }).join("");
  const agg={};
  hist.forEach(h=> Object.keys(h.topics||{}).forEach(k=>{ agg[k]=agg[k]||{c:0,t:0}; agg[k].c+=h.topics[k].c; agg[k].t+=h.topics[k].t; }));
  const weak=Object.keys(agg).map(k=>({k,c:agg[k].c,t:agg[k].t,p:agg[k].c/agg[k].t})).sort((a,b)=> a.p-b.p || b.t-a.t).slice(0,12);
  const weakRows=weak.length? weak.map(w=>`<tr><td>${w.k}</td><td>${w.c}/${w.t}</td><td><span class="pill ${w.p>=0.7?'g':w.p>=0.4?'y':'r'}">${Math.round(w.p*100)}%</span></td></tr>`).join("") : `<tr><td colspan="3" class="hint">No topic data yet.</td></tr>`;
  const attempts=hist.slice().reverse().slice(0,15).map(h=>{ const d=new Date(h.ts); const subj=h.subject==="ALL"?"All":(SUBJNAME[h.subject]||h.subject); return `<tr><td>${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td><td>${subj}</td><td>${h.correct}/${h.total}</td><td><span class="pill ${h.pct>=70?'g':h.pct>=40?'y':'r'}">${h.pct}%</span></td><td>${fmtTime(h.usedMs)}</td></tr>`; }).join("");
  stage.innerHTML=`
    <div class="card">
      <h3 style="margin:0 0 12px">📈 Your progress</h3>
      <div class="pgrid">
        <div class="pcard"><div class="pnum">${n}</div><div class="hint">exams taken</div></div>
        <div class="pcard"><div class="pnum">${avg}%</div><div class="hint">average</div></div>
        <div class="pcard"><div class="pnum">${best}%</div><div class="hint">best</div></div>
        <div class="pcard"><div class="pnum">${last}%</div><div class="hint">last ${trendTxt}</div></div>
      </div>
      <div class="hint" style="margin:16px 0 6px">Score trend (last ${recent.length} exams)</div>
      <div class="spark">${bars}</div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin:0 0 4px">🎯 Weak topics across all exams</h3>
      <p class="hint" style="margin:0 0 10px">Aggregated over every attempt — revise the reds first.</p>
      <table class="rtab"><tr><th>Topic</th><th>Cumulative</th><th>%</th></tr>${weakRows}</table>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin:0 0 10px">🗓️ Recent attempts</h3>
      <table class="rtab"><tr><th>When</th><th>Subject</th><th>Score</th><th>%</th><th>Time</th></tr>${attempts}</table>
      <div class="actions" style="margin-top:16px">
        <button class="btn" id="pclear">🗑️ Clear history</button>
        <button class="btn primary" id="pexam">📄 Take a mock exam</button>
      </div>
    </div>`;
  document.getElementById("pexam").onclick=()=> setMode("exam");
  document.getElementById("pclear").onclick=()=>{ if(confirm("Clear all saved exam history? This cannot be undone.")){ const g=store.get(); delete g.history; store.set(g); renderProgress(); } };
  typeset(stage);
}

/* Mode toggle */
function setMode(m){
  if(state.mode==="exam" && m!=="exam"){ stopExamTimer(); state.exam=null; }
  state.mode=m;
  document.querySelectorAll("#mode button").forEach(x=> x.classList.toggle("active", x.dataset.mode===m));
  buildOrder(); render();
}
document.getElementById("mode").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  setMode(b.dataset.mode);
});

/* Keyboard shortcuts */
document.addEventListener("keydown", e=>{
  if(["1","2","3","4"].includes(e.key)){
    const b = document.querySelector('.opt[data-k="'+(+e.key-1)+'"]');
    if(b && !b.disabled) b.click();
  } else if(e.code==="Space"){
    if(document.activeElement && document.activeElement.tagName==="INPUT") return;
    e.preventDefault();
    const next = document.getElementById("next");
    const skip = document.getElementById("skip");
    const newp = document.getElementById("newp");
    if(next && !next.disabled) next.click();
    else if(newp) newp.click();
    else if(skip) skip.click();
  }
});

document.getElementById("reset").onclick = (e)=>{
  e.preventDefault();
  localStorage.removeItem("bits_study");
  state.best = 0; buildOrder(); render();
};

/* init */
buildOrder();
renderSubjects();
render();
</script>
</body>
</html>
